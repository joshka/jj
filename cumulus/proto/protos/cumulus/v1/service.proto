// The cumulusd gRPC surface (cumulus/docs/SPEC.md §6.2).
//
// All RPCs carry `repo` except ListRepos/Health. Limits: metadata batches
// are at most 10k objects / 32 MiB per message; blob frames are 1 MiB.
// RPCs marked SPEC-ONLY are declared for wire stability and return
// UNIMPLEMENTED in v1.

syntax = "proto3";

package cumulus.v1;

import "cumulus/v1/objects.proto";
import "cumulus/v1/ops.proto";

message Empty {}

message RepoRef {
  string repo = 1;
}

// Op-log synchronization mode (cumulus/docs/SPEC.md §8).
enum OpMode {
  OP_MODE_UNSPECIFIED = 0;
  // Mode A: local-first with background auto-push (§8.1, v1 default).
  OP_MODE_LOCAL_FIRST = 1;
  // Mode B: remote-first "commit cloud" (§8.2, SPEC-ONLY).
  OP_MODE_REMOTE_FIRST = 2;
}

// Reserved node-completeness declaration (cumulus/docs/SPEC.md §13.6; unused in v1).
enum Completeness {
  COMPLETENESS_UNSPECIFIED = 0;
  COMPLETENESS_FULL = 1;
  COMPLETENESS_LAZY = 2;
}

message RepoInfo {
  string name = 1;
  uint32 commit_id_length = 2;
  uint32 change_id_length = 3;
  bytes root_commit_id = 4;
  bytes empty_tree_id = 5;
  uint32 protocol_version = 6;
  OpMode op_mode = 7;
  Completeness completeness = 8;
}

message CreateRepoRequest {
  string name = 1;
}

message ListReposResponse {
  repeated RepoInfo repos = 1;
}

// Object kind discriminant. Numeric values match cumulus-store's
// `objects.kind` column.
enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  COMMIT = 1;
  TREE = 2;
  SYMLINK = 3;
}

message ObjectRef {
  ObjectKind kind = 1;
  bytes id = 2;
}

message Object {
  ObjectKind kind = 1;
  bytes id = 2;
  bytes data = 3;
}

// One message of an object stream. For PutObjects, `repo` must be set on
// the first chunk (later chunks may omit it).
message ObjectChunk {
  string repo = 1;
  repeated Object objects = 2;
}

message HaveObjectsRequest {
  string repo = 1;
  repeated ObjectRef refs = 2;
}

message HaveObjectsResponse {
  // The subset of the requested refs the server does not have.
  repeated ObjectRef missing = 1;
}

message GetObjectsRequest {
  string repo = 1;
  repeated ObjectRef refs = 2;
}

message PutObjectsResponse {
  uint32 object_count = 1;
}

message GetBlobRequest {
  string repo = 1;
  bytes id = 2;
}

// Offset-tagged so that ranged resume and CDC-chunked serving (§13.1) stay
// wire-compatible.
message BlobFrame {
  uint64 offset = 1;
  bytes data = 2;
}

message PutBlobFrame {
  message Header {
    string repo = 1;
    bytes id = 2;
    uint64 size = 3;
  }
  oneof frame {
    // Frame 0.
    Header header = 1;
    bytes data = 2;
  }
}

message PutBlobResponse {
  bytes id = 1;
  uint64 size = 2;
}

// Ancestors-of(heads) walked over commit_parents, stopping at the `have`
// frontier. THE lazy-clone workhorse.
message ReachabilityRequest {
  string repo = 1;
  repeated bytes heads = 2;
  repeated bytes have = 3;
}

message OpHeadsResponse {
  repeated bytes op_head_ids = 1;
}

message HaveOpsRequest {
  string repo = 1;
  repeated bytes op_ids = 2;
}

message HaveOpsResponse {
  // The subset of the requested op ids the server does not have.
  repeated bytes missing_op_ids = 1;
}

message GetOpsRequest {
  string repo = 1;
  repeated bytes op_ids = 2;
}

message OpWithView {
  bytes op_id = 1;
  bytes op_data = 2;
  bytes view_id = 3;
  // Empty when the receiver is known to have the view already.
  bytes view_data = 4;
}

message PushOpsRequest {
  string repo = 1;
  // Oldest-first; each op's parents must precede it or already be stored.
  repeated OpWithView ops = 2;
}

message PushOpsResponse {
  // The op heads after the push.
  repeated bytes op_head_ids = 1;
}

// §8.2 SPEC-ONLY (UNIMPLEMENTED in v1).
message UpdateOpHeadsCasRequest {
  string repo = 1;
  repeated bytes expected_heads = 2;
  bytes new_head = 3;
}

// §8.2 SPEC-ONLY (UNIMPLEMENTED in v1).
message UpdateOpHeadsCasResponse {
  bool committed = 1;
  repeated bytes current_heads = 2;
}

// §8.2 SPEC-ONLY (UNIMPLEMENTED in v1).
message OpHeadsUpdate {
  repeated bytes op_head_ids = 1;
}

message HealthResponse {
  string status = 1;
  uint32 protocol_version = 2;
}

// §13.5 SPEC-ONLY (UNIMPLEMENTED in v1).
message GcRequest {
  string repo = 1;
}

// §13.5 SPEC-ONLY (UNIMPLEMENTED in v1).
message GcResponse {}

// §13.1 SPEC-ONLY (UNIMPLEMENTED in v1).
message BlobManifest {
  message ChunkRef {
    uint32 seq = 1;
    bytes chunk_id = 2;
    uint64 offset = 3;
    uint64 len = 4;
  }
  bytes blob_id = 1;
  uint64 size = 2;
  repeated ChunkRef chunks = 3;
}

// §13.1 SPEC-ONLY (UNIMPLEMENTED in v1).
message GetChunksRequest {
  string repo = 1;
  repeated bytes chunk_ids = 2;
}

// §13.1 SPEC-ONLY (UNIMPLEMENTED in v1).
message ChunkData {
  bytes chunk_id = 1;
  bytes data = 2;
}

// §13.2 SPEC-ONLY (UNIMPLEMENTED in v1).
message GetIndexManifestRequest {
  string repo = 1;
  bytes op_id = 2;
}

// §13.2 SPEC-ONLY (UNIMPLEMENTED in v1).
message IndexManifest {
  repeated bytes segment_ids = 1;
}

// §13.2 SPEC-ONLY (UNIMPLEMENTED in v1).
message GetIndexSegmentsRequest {
  string repo = 1;
  repeated bytes segment_ids = 2;
}

// §13.2 SPEC-ONLY (UNIMPLEMENTED in v1).
message IndexSegment {
  bytes segment_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

service RepoService {
  // Idempotent by name.
  rpc CreateRepo(CreateRepoRequest) returns (RepoInfo);
  rpc GetRepoInfo(RepoRef) returns (RepoInfo);
  rpc ListRepos(Empty) returns (ListReposResponse);
}

service ObjectService {
  rpc HaveObjects(HaveObjectsRequest) returns (HaveObjectsResponse);
  rpc GetObjects(GetObjectsRequest) returns (stream ObjectChunk);
  rpc PutObjects(stream ObjectChunk) returns (PutObjectsResponse);
  rpc GetBlob(GetBlobRequest) returns (stream BlobFrame);
  rpc PutBlob(stream PutBlobFrame) returns (PutBlobResponse);
  rpc GetCommitsReachableFrom(ReachabilityRequest) returns (stream ObjectChunk);
  // §13.1 SPEC-ONLY (UNIMPLEMENTED in v1):
  rpc GetBlobManifest(GetBlobRequest) returns (BlobManifest);
  rpc GetChunks(GetChunksRequest) returns (stream ChunkData);
}

service OpService {
  rpc GetOpHeads(RepoRef) returns (OpHeadsResponse);
  rpc HaveOps(HaveOpsRequest) returns (HaveOpsResponse);
  rpc GetOps(GetOpsRequest) returns (stream OpWithView);
  rpc PushOps(PushOpsRequest) returns (PushOpsResponse);
  // §8.2 SPEC-ONLY (UNIMPLEMENTED in v1):
  rpc UpdateOpHeadsCas(UpdateOpHeadsCasRequest) returns (UpdateOpHeadsCasResponse);
  rpc SubscribeOpHeads(RepoRef) returns (stream OpHeadsUpdate);
}

service AdminService {
  rpc Health(Empty) returns (HealthResponse);
  // §13.5 SPEC-ONLY (UNIMPLEMENTED in v1):
  rpc Gc(GcRequest) returns (GcResponse);
}

// §13.2 SPEC-ONLY, all UNIMPLEMENTED in v1.
service IndexService {
  rpc GetIndexManifest(GetIndexManifestRequest) returns (IndexManifest);
  rpc GetIndexSegments(GetIndexSegmentsRequest) returns (stream IndexSegment);
}
