# Rumdl enables these rules by default. We disable the ones that report findings
# in jj's existing Markdown so adding the tool requires no formatting changes.
# The list is long because it records each difference from rumdl's defaults, not
# because it defines a new style. Remove exceptions as we discuss and address them;
# rules that do not suit jj can stay disabled or use different settings.
# See https://github.com/jj-vcs/jj/issues/10210.
#
# Baseline: 7f96d3eb, counted with rumdl 0.2.78 on 2026-10-21, 113 files.
# 1,276 findings across 30 default rules. Counts are diagnostics, not lines
# changed, and are a snapshot to recount when enabling a rule. The merge-conflict
# rule is suppressed inline around the examples of conflict markers in the docs.

[global]
# Include both documentation sites. The generated CLI reference is not checked;
# its source is the doc comments in the Rust code.
include = ["**/*.md", "**/*.mdx"]
# Symlinks duplicate files already covered by the scan.
exclude = ["**/node_modules/**", "**/cli/docs/**", "**/docs/governance/GOVERNANCE.md"]
disable = [
    # 272 findings. Line length should not be excessive.
    # https://github.com/rvben/rumdl/blob/main/docs/md013.md
    "line-length",
    # 4 findings. Blank line inside blockquote.
    # https://github.com/rvben/rumdl/blob/main/docs/md028.md
    "no-blanks-blockquote",
    # 37 findings. Inline HTML is not allowed.
    # https://github.com/rvben/rumdl/blob/main/docs/md033.md
    "no-inline-html",
    # 7 findings. First line in file should be a top level heading.
    # https://github.com/rvben/rumdl/blob/main/docs/md041.md
    "first-line-heading",
    # 44 findings. Code blocks should use a consistent style.
    # https://github.com/rvben/rumdl/blob/main/docs/md046.md
    "code-block-style",
    # 4 findings. Link fragments should reference valid headings.
    # https://github.com/rvben/rumdl/blob/main/docs/md051.md
    "link-fragments",
    # 3 findings. Relative links should point to existing files.
    # https://github.com/rvben/rumdl/blob/main/docs/md057.md
    "existing-relative-links",
]

# Commented settings below show the disabled rules' default options, as reported
# by rumdl config --defaults. Rules without options need only removal from disable.

