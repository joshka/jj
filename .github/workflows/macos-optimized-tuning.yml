name: macOS optimized workspace tuning

on:
  push:
    branches: [joshka/ci-macos-cache-benchmark]

permissions:
  contents: read

jobs:
  tune:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Record runner architecture
      run: |
        uname -a
        sysctl -n hw.ncpu hw.memsize
    - name: Install Rust
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.97.1
        targets: x86_64-apple-darwin
    - name: Restore dependency cache
      id: cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        prefix-key: jj-macos-cache-probe-v1
        shared-key: ${{ matrix.os }}-x86-ci
        key: ${{ hashFiles('.cargo/config-ci.toml') }}
        cache-bin: false
        cache-workspace-crates: false
        save-if: false
    - name: Record cache result
      run: echo "Exact dependency cache hit = $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
    - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
      with:
        tool: nextest
    - name: Build
      run: >-
        cargo build --config .cargo/config-ci.toml --config profile.dev.opt-level=1
        --workspace --all-targets --target x86_64-apple-darwin --timings
    - name: Default test concurrency
      run: |
        set -o pipefail
        /usr/bin/time -l cargo nextest run --config .cargo/config-ci.toml --config profile.dev.opt-level=1 --workspace --all-targets --profile ci --target x86_64-apple-darwin 2>&1 | tee default-tests.log
      env:
        RUST_BACKTRACE: 1
    - name: Doubled test concurrency
      run: |
        set -o pipefail
        threads=$(($(sysctl -n hw.logicalcpu) * 2))
        echo "Testing with $threads concurrent tests" >> "$GITHUB_STEP_SUMMARY"
        /usr/bin/time -l cargo nextest run --config .cargo/config-ci.toml --config profile.dev.opt-level=1 --workspace --all-targets --profile ci --target x86_64-apple-darwin --test-threads "$threads" 2>&1 | tee doubled-tests.log
      env:
        RUST_BACKTRACE: 1
